# Dependabot: weekly version updates on top of the security alerts GitHub already sends.
# Vercel skips preview builds for these branches (vercel.json: "dependabot/**": false).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Beirut
    # Let new releases settle before proposing them (a guard against bad or hijacked publishes).
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 5
    # Majors the lint toolchain can't take yet (checked 2026-10-06); revisit when eslint-config-next moves.
    ignore:
      # typescript-eslint (inside eslint-config-next) supports TypeScript >=4.8.4 <6.1.0.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # eslint-plugin-react (inside eslint-config-next) crashes on ESLint 10 (getFilename was removed).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Packages that must move together get one PR; everything else small is batched.
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Beirut
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
